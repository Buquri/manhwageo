<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <title>Manhwageo - მანჰვები ქართულად | ონლაინ მანჰვა პლატფორმა</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" id="meta-description" content="Manhwageo - ქართული მანჰვების ონლაინ ბიბლიოთეკა. წაიკითხეთ საუკეთესო მანჰვები ქართულ ენაზე.">
  <meta name="google-site-verification" content="lpREk9L7NYUoWXCPbz9BZ4tmhtufKY_cBmAU17UTcM4" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* სტილების გადატვირთვა კონსისტენტურობისთვის */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ADDED: Dark/Light Mode-ის ცვლადები */
    :root {
        --bg-color: #E9967A;
        --text-color: #ffffff;
        --box-bg-color: #197;
        --header-bg: rgba(0, 0, 0, 0.7);
        --border-color: #333;
        --modal-bg: rgba(0, 0, 0, 0.95);
        --button-primary-bg: #ff4444;
        --button-primary-hover-bg: #cc0000;
        --spinner-color: #fff;
    }

    body.dark-mode {
        --bg-color: #121212;
        --text-color: #e0e0e0;
        --box-bg-color: #1f1f1f;
        --header-bg: rgba(0, 0, 0, 0.8);
        --border-color: #444;
        --modal-bg: rgba(0, 0, 0, 0.98);
        --button-primary-bg: #bb86fc;
        --button-primary-hover-bg: #a053fc;
        --spinner-color: #bb86fc;
    }

    body {
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 0;
      padding: 10px;
      background-color: var(--bg-color);
      color: var(--text-color);
      overflow-x: hidden;
      min-height: 100vh;
      position: relative;
      transition: background-color 0.3s, color 0.3s;
    }
    
    /* ADDED: ჰედერისა და თემის გადამრთველი ღილაკის სტილები */
    header {
      width: 100%;
      max-width: 750px;
      margin: 0 auto;
      display: flex;
      justify-content: flex-end;
      padding: 0 5px;
    }

    #theme-toggle {
      background: var(--box-bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 1.2em;
    }

    /* მთავარი გრიდი (განლაგება) */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      flex-grow: 1;
    }

    @media (min-width: 768px) {
      .main-grid {
        grid-template-columns: repeat(2, 1fr);
        max-width: 750px;
        margin: 0 auto;
      }
    }

    .box {
      border: 2px solid var(--border-color);
      overflow: hidden;
      position: relative;
      background-color: var(--box-bg-color);
      background-size: cover;
      background-position: left;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-start;
      border-radius: 6px;
      width: 100%;
      aspect-ratio: 730 / 1050;
      box-sizing: border-box;
      padding: 5px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .box:hover {
      transform: translateY(-3px);
      box-shadow: 4px 4px 10px rgba(0,0,0,0.2);
    }

    .box.first { background-image: url('images/bg-main.jpg'); }
    .box.second { background-image: url('images/bg-2.jpg'); }
    .box.third { background-image: url('images/bg-3.jpg'); }
    .box.fourth { background-image: url('images/bg-4.jpg'); }
    .box.fifth { background-image: url('images/bg-5.jpg'); }
    .box.sixth { background-image: url('images/bg-6.jpg'); }

    .box h2,
    .box button {
      position: relative;
      z-index: 2;
      color: white;
      background-color: var(--header-bg);
      padding: 8px 12px;
      border: none;
      border-radius: 10px;
      margin: 5px 10px 10px 15px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      font-size: 0.8em;
    }

    @media (min-width: 768px) {
      .box h2, .box button {
        font-size: 1em;
      }
    }

    .box button:hover:not(:disabled) {
      background-color: rgba(0, 0, 0, 0.9);
    }

    .box button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
      background-color: rgba(50, 50, 50, 0.7);
    }

    .views-counter {
      position: relative;
      z-index: 2;
      color: #ccc;
      background-color: var(--header-bg);
      padding: 5px 10px;
      border-radius: 8px;
      margin: 0px 10px 5px 10px;
      font-size: 0.8em;
      display: flex;
      align-items: center;
      gap: 5px;
      align-self: flex-start;
    }

    .views-counter i {
      color: var(--button-primary-bg);
    }

    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: var(--modal-bg);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .overlay {
      background-color: var(--bg-color);
      padding: 15px;
      border-radius: 8px;
      max-width: 95vw;
      max-height: 98vh;
      display: flex;
      flex-direction: column;
    }

    #chapterModal .overlay {
      padding: 0;
      max-width: 100vw;
      max-height: 100vh;
      width:100%;
      height: 100%;
      border-radius: 0;
      background-color: var(--bg-color);
    }
    
    .modal-scrollable-content {
        flex-grow: 1;
        overflow-y: auto;
        padding: 0 15px;
        -ms-overflow-style: none;
        scrollbar-width: none;
    }

    .modal-scrollable-content::-webkit-scrollbar {
        display: none;
    }

    .chapter-buttons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 10px;
      margin-top: 15px;
    }

    .chapter-buttons button {
      padding: 10px 15px;
      background-color: var(--button-primary-bg);
      border: none;
      color: white;
      font-size: 0.9em;
      cursor: pointer;
      border-radius: 5px;
      transition: background-color 0.5s ease, transform 0.8s ease;
    }
    
    .chapter-buttons button:hover {
      background-color: var(--button-primary-hover-bg);
      transform: scale(1.03);
    }
    
    .images-container {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      overflow-y: scroll;
      -ms-overflow-style: none;
      scrollbar-width: none;
      margin-top: 0;
      background-color: black;
    }

    .images-container::-webkit-scrollbar { display: none; }

    /* MODIFIED: შევცვალეთ სურათის სტილები სპინერის ლოგიკისთვის */
    .images-container img, .images-container video {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 0;
      max-width: 100%;
    }

    /* ADDED: სურათის კონტეინერისა და სპინერის სტილები */
    .image-container {
      position: relative;
      min-height: 250px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000;
    }

    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.2);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border-left-color: var(--spinner-color);
      animation: spin 1s ease infinite;
      position: absolute;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .chapter-image {
        opacity: 0;
        transition: opacity 0.5s ease;
    }

    .chapter-image.loaded {
        opacity: 1;
    }

    .loading-indicator {
        text-align: center;
        padding: 20px;
        font-size: 1.2em;
        color: #ddd;
    }
    
    .modal-header, .modal-controls {
      background-color: rgba(0, 0, 0, 1);
      position: sticky;
      z-index: 1000;
      transition: opacity 0.3s ease-out, visibility 0.3s ease-out;
      opacity: 1;
      visibility: visible;
    }
    .modal-header { top: 0; }
    .modal-controls { bottom: 0; }

    .modal-header {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        width: 100%;
        padding: 10px 15px;
    }

    .modal-header.hidden, .modal-controls.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .modal-header h2 { margin: 0; font-size: 1.2em; }

    .modal-description {
      font-size: 0.9em;
      color: #b3da06;
      margin-top: 10px;
      margin-bottom: 15px;
    }

    .modal-controls {
      display: flex;
      justify-content: space-between;
      width: 100%;
      padding: 15px;
      margin-top: auto;
    }
    
    .modal-controls .close-btn,
    .modal-controls .navigation-buttons button {
      margin: 0;
      padding: 8px 15px;
      font-size: 0.9em;
      flex: 1;
    }

    .modal-controls .close-btn { margin-left: 10px; }

    .navigation-buttons { display: flex; gap: 10px; flex-grow: 1; }

    .navigation-buttons button {
      background-color: var(--button-primary-bg);
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 5px;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    #fullscreenBtn {
      flex-grow: 0; 
      margin-left: auto; 
      margin-right: 10px;
      background-color: #6a5acd;
    }
    .navigation-buttons button:hover:not(:disabled) {
        background-color: var(--button-primary-hover-bg);
        transform: scale(1.03);
    }
    .navigation-buttons button:disabled {
        background-color: #555;
        cursor: not-allowed;
        opacity: 0.6;
    }

    /* ADDED: Back to top ღილაკი */
    #back-to-top {
        position: fixed;
        bottom: 20px;
        right: 20px;
        display: none;
        background-color: var(--button-primary-bg);
        color: white;
        border: none;
        padding: 10px 15px;
        border-radius: 50%;
        cursor: pointer;
        z-index: 1000;
        font-size: 1.2em;
    }
    
    /* ADDED: შეცდომის შეტყობინება */
    #error-notification {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background-color: #ff4d4d;
        color: white;
        padding: 15px 25px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        z-index: 2000;
        transition: opacity 0.5s;
    }

    .hidden {
        display: none !important; /* !important to override other display properties */
    }

    /* ანიმაციური პერსონაჟი (უცვლელი) */
    #animated-character { position: fixed; bottom: 10px; left: 0; width: 120px; height: 130px; background-size: contain; background-repeat: no-repeat; background-position: center; z-index: 99; image-rendering: pixelated; }
    #character-controls { position: fixed; bottom: 3px; right: 3px; z-index: 100; display: flex; flex-direction: column; gap: 5px; }
    #character-controls button { background-color: #6a5acd; color: white; border: none; padding: 3px 5px; border-radius: 3px; cursor: pointer; transition: background-color 0.3s ease; font-size: 0.7em; }
    #character-controls button:hover { background-color: #483d8b; }
    #character-controls button:disabled { background-color: #777; cursor: not-allowed; opacity: 0.7; }
  </style>

  <script type="module">
    // Firebase კოდი უცვლელია
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-analytics.js";
    import { getFirestore, doc, getDoc, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBRcdavGb1Pi2eQlN6T_UbNue2bEa-8t-g",
      authDomain: "manhwageo.firebaseapp.com",
      projectId: "manhwageo",
      storageBucket: "manhwageo.firebasestorage.app",
      messagingSenderId: "822450839137",
      appId: "1:822450839137:web:7dcb516bf572ae08191420",
      measurementId: "G-3KMGGLE821"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    export const db = getFirestore(app);

    window.updateAndGetViews = async function(manhwaId) {
      const docRef = doc(db, "manhwa_views", manhwaId);
      try {
        const docSnap = await getDoc(docRef);
        let views = 0;
        if (docSnap.exists()) {
          views = docSnap.data().count + 1;
          await updateDoc(docRef, { count: views });
        } else {
          views = 1;
          await setDoc(docRef, { count: views });
        }
        return views;
      } catch (error) {
        console.error("ნახვების განახლების შეცდომა: ", error);
        return "შეცდომა";
      }
    };

    window.getInitialViews = async function(manhwaId) {
      const docRef = doc(db, "manhwa_views", manhwaId);
      try {
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) {
          return docSnap.data().count;
        } else {
          return 0;
        }
      } catch (error) {
        console.error("საწყისი ნახვების წამოღების შეცდომა: ", error);
        return "შეცდომა";
      }
    };

    document.addEventListener('DOMContentLoaded', async () => {
      const manhwaBoxes = document.querySelectorAll('.box[data-manhwa-id]');
      for (const box of manhwaBoxes) {
        const manhwaId = box.dataset.manhwaId;
        if (manhwaId) {
          const viewsElement = box.querySelector(`#views-${manhwaId}`);
          if (viewsElement) {
            const views = await window.getInitialViews(manhwaId);
            viewsElement.textContent = views;
          }
        }
      }
    });
  </script>
</head>

<body>

  <button id="back-to-top" title="ზემოთ დაბრუნება" class="hidden"><i class="fas fa-arrow-up"></i></button>

  <script>
    // --- საიტის ძირითადი ლოგიკა ---

    const manhwas = {
      "ch": {
        title: "ბნელი ჯადოქრის დაბრუნება", // მოვაშორე 1
        folder: "images/",

        type: 'image',

          { id: 7, pages: 12 }, { id: 8, pages: 15 }, { id: 9, pages: 11 },

          { id: 19, pages: 16 }, 
        ]
      },
      "w2_ch": {
        title: "რკინის სისხლიანი ხმლის მქონე მონადირის შურისძიება", folder: "images2/",
        description: "ის ბასკერვილების ოჯახის მონადირე იყო: ვიკირი...", type: 'image',
        chapters: [ { id: 1, pages: 10 }, { id: 2, pages: 10 },  { id: 3, pages: 10 }, { id: 4, pages: 10 },  { id: 5, pages: 11 },  { id: 6, pages: 12 },  { id: 7, pages: 12 }, { id: 8, pages: 14 },{ id: 9, pages: 11 }, ]
      },
      "w3_ch": {

      },
      "w4_ch": { title: "მალეე", folder: "images4/", description: "უახლესი მანჰვა...", type: 'image', chapters: [] },

      "video_manhwa2": { title: "მეექვსე", folder: "videos/", description: "მთავარია თქვენი აქტიურობა...", type: 'video', chapters: [ { id: 1, file: "w6_v1.mp4" } ] }
    };

    let currentManhwaId = null;
    let currentChapterId = null;
    let currentOpenModalId = null;
    let lastScrollTop = 0;
    let scrollTimeout;
    
    // ADDED: ახალი DOM ელემენტების ამორჩევა
    const backToTopButton = document.getElementById('back-to-top');
    const errorNotification = document.getElementById('error-notification');
    const errorMessageElement = document.getElementById('error-message');

    function toggleModal(id, doPushState = true) {
      const modal = document.getElementById(id);
      if (modal.style.display === 'flex') {
        modal.style.display = 'none';
        if (doPushState && currentOpenModalId === id) {
          history.back();
          currentOpenModalId = null;
        }
        if (id === 'chapterModal') {
          if (document.fullscreenElement) document.exitFullscreen();
          document.getElementById('chapterModalHeader').classList.remove('hidden');
          document.getElementById('chapterModalControls').classList.remove('hidden');
          clearTimeout(scrollTimeout);
        }
      } else {
        modal.style.display = 'flex';
        currentOpenModalId = id;
        if (doPushState) history.pushState({ modal: id }, '', `#${id}`);
      }
    }

    // --- უცვლელი ფუნქცია ---
    function openChapterSelect(manhwaId) {
      currentManhwaId = manhwaId;
      const manhwaData = manhwas[manhwaId];
      document.getElementById('chapterSelectTitle').textContent = manhwaData.title;
      document.getElementById('manhwaDescription').textContent = manhwaData.description;
      const chapterButtons = document.getElementById('chapterButtons');
      chapterButtons.innerHTML = '';
      if (manhwaData.chapters.length === 0) {
        chapterButtons.innerHTML = '<p style="text-align:center; color:#aaa; font-size: 0.9em;">თავები ჯერ არ არის დამატებული.</p>';
      } else {
        manhwaData.chapters.forEach(chapter => {
          const btn = document.createElement('button');
          btn.textContent = `თავი ${chapter.id}`;
          if (manhwaData.type === 'video') btn.onclick = () => openChapter(chapter.id, chapter.file);
          else btn.onclick = () => openChapter(chapter.id, chapter); // ვაწვდით მთლიან chapter ობიექტს
          chapterButtons.appendChild(btn);
        });
      }
      const viewsElement = document.querySelector(`.box[data-manhwa-id="${manhwaId}"] .views-counter span`);
      if (viewsElement && window.updateAndGetViews) {
        window.updateAndGetViews(manhwaId).then(views => { viewsElement.textContent = views; });
      }
      toggleModal('chapterSelect');
    }

    // --- ADDED: სურათის ჩატვირთვის Fallback ლოგიკა ---
    function tryLoadImage(imgElement, baseUrl, spinner) {
        const extensions = ['jpg', 'png', 'webp']; // ვცდით ამ გაფართოებებს
        let currentExtIndex = 0;

        function load() {
            if (currentExtIndex >= extensions.length) {
                console.error(`სურათის ჩატვირთვა ვერ მოხერხდა: ${baseUrl}`);
                spinner.style.display = 'none'; // სპინერის დამალვა
                imgElement.alt = 'სურათის ჩატვირთვა ვერ მოხერხდა';
                // შეგიძლიათ დაამატოთ placeholder სურათი აქ
                // imgElement.src = 'images/placeholder.jpg';
                // imgElement.classList.add('loaded');
                return;
            }
            imgElement.src = `${baseUrl}.${extensions[currentExtIndex]}`;
        }

        imgElement.onerror = () => {
            currentExtIndex++;
            load();
        };

        imgElement.onload = () => {
            spinner.style.display = 'none';
            imgElement.classList.add('loaded');
        };

        load();
    }

    // --- MODIFIED: ფუნქცია მთლიანად განახლდა ახალი ფუნქციონალით ---
    function loadChapterContent(chapterId, chapterData) {
        try {
            currentChapterId = chapterId;
            const imagesContainer = document.getElementById('imagesContainer');
            imagesContainer.innerHTML = ''; // ვასუფთავებთ სრულად
            imagesContainer.scrollTop = 0;

            const manhwaData = manhwas[currentManhwaId];

            // --- SEO: Title და Meta Description-ის გენერაცია ---
            document.title = `${manhwaData.title} - თავი ${chapterId} | Manhwageo`;
            const metaDescription = `წაიკითხეთ ${manhwaData.title}-ის ${chapterId} თავი ქართულად. ${manhwaData.description.substring(0, 100)}...`;
            document.getElementById('meta-description').setAttribute('content', metaDescription);
            
            document.getElementById('chapterTitle').textContent = `${manhwaData.title} - თავი ${chapterId}`;
            
            document.getElementById('chapterModalHeader').classList.remove('hidden');
            document.getElementById('chapterModalControls').classList.remove('hidden');
            clearTimeout(scrollTimeout);

            if (manhwaData.type === 'image') {
                const startPage = chapterData.skipFirst ? 2 : 1; // ვამოწმებთ skipFirst პარამეტრს
                for (let i = startPage; i <= chapterData.pages; i++) {
                    const container = document.createElement('div');
                    container.className = 'image-container';
                    
                    const spinner = document.createElement('div');
                    spinner.className = 'spinner';
                    
                    const img = document.createElement('img');
                    img.className = 'chapter-image';
                    img.loading = 'lazy'; // Performance: Lazy Loading
                    img.alt = `${manhwaData.title} - თავი ${chapterId}, გვერდი ${i}`; // SEO: Alt ტექსტი

                    container.appendChild(spinner);
                    container.appendChild(img);
                    imagesContainer.appendChild(container);

                    const baseUrl = `${manhwaData.folder}${currentManhwaId}${chapterId}_page${i}`;
                    tryLoadImage(img, baseUrl, spinner);
                }
                // --- SEO: Structured Data (Schema.org) ---
                generateStructuredData(chapterId, chapterData.pages);
            } else if (manhwaData.type === 'video') {
                // ვიდეოს ლოგიკა უცვლელია
            }
            updateNavigationButtons();
        } catch (error) {
            showError(`თავის ჩატვირთვისას მოხდა შეცდომა: ${error.message}`);
        }
    }

    function openChapter(chapterId, chapterData) {
        loadChapterContent(chapterId, chapterData);
        toggleModal('chapterSelect', false);
        toggleModal('chapterModal', true);
    }
    
    function navigateChapter(direction) {
        const manhwaData = manhwas[currentManhwaId];
        const currentChapterIndex = manhwaData.chapters.findIndex(ch => ch.id === currentChapterId);
        const newChapterIndex = currentChapterIndex + direction;
        
        if (newChapterIndex >= 0 && newChapterIndex < manhwaData.chapters.length) {
            const newChapter = manhwaData.chapters[newChapterIndex];
            if (manhwaData.type === 'video') {
                loadChapterContent(newChapter.id, newChapter.file);
            } else {
                loadChapterContent(newChapter.id, newChapter); // ვაწვდით მთლიან ობიექტს
            }
        }
    }
    
    // --- უცვლელი ფუნქციები ---
    function updateNavigationButtons() {
        const prevBtn = document.getElementById('prevChapterBtn');
        const nextBtn = document.getElementById('nextChapterBtn');
        const manhwaData = manhwas[currentManhwaId];
        const currentChapterIndex = manhwaData.chapters.findIndex(ch => ch.id === currentChapterId);
        prevBtn.disabled = currentChapterIndex <= 0;
        nextBtn.disabled = currentChapterIndex >= manhwaData.chapters.length - 1;
    }

    window.onpopstate = function(event) {
      if (document.getElementById('chapterModal').style.display === 'flex') {
        toggleModal('chapterModal', false);
        if(currentManhwaId) openChapterSelect(currentManhwaId);
      } else if (document.getElementById('chapterSelect').style.display === 'flex') {
        toggleModal('chapterSelect', false);
      }
      currentOpenModalId = null;
    };

    window.onload = function() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash === 'chapterSelect' || hash === 'chapterModal') {
                history.replaceState({}, '', window.location.pathname + window.location.search);
            }
        }
    };
    
    // Header/Controls დამალვის ლოგიკა (უცვლელი)
    document.getElementById('imagesContainer').addEventListener('scroll', function() {
        const currentScrollTop = this.scrollTop;
        const header = document.getElementById('chapterModalHeader');
        const controls = document.getElementById('chapterModalControls');
        clearTimeout(scrollTimeout);
        if (currentScrollTop > lastScrollTop && currentScrollTop > 50) {
            header.classList.add('hidden'); controls.classList.add('hidden');
        } else if (lastScrollTop - currentScrollTop > 30) {
            header.classList.remove('hidden'); controls.classList.remove('hidden');
        }
        lastScrollTop = currentScrollTop <= 0 ? 0 : currentScrollTop;
    });

    document.getElementById('imagesContainer').addEventListener('click', function() {
      const header = document.getElementById('chapterModalHeader');
      const controls = document.getElementById('chapterModalControls');
      if (header.classList.contains('hidden')) {
          header.classList.remove('hidden'); controls.classList.remove('hidden');
          clearTimeout(scrollTimeout);
          scrollTimeout = setTimeout(() => { header.classList.add('hidden'); controls.classList.add('hidden'); }, 3000);
      } else {
          header.classList.add('hidden'); controls.classList.add('hidden');
      }
    });
    
    // სრული ეკრანის ფუნქციონალი (უცვლელი)
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const chapterModal = document.getElementById('chapterModal');
    fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
            chapterModal.requestFullscreen().catch(err => { alert(`Fullscreen error: ${err.message}`); });
        } else { document.exitFullscreen(); }
    });
    document.addEventListener('fullscreenchange', () => {
        const icon = fullscreenBtn.querySelector('i');
        if (!document.fullscreenElement) {
            icon.classList.remove('fa-compress'); icon.classList.add('fa-expand');
        } else {
            icon.classList.remove('fa-expand'); icon.classList.add('fa-compress');
        }
    });

    // --- ADDED: ახალი ფუნქციები ---
    
    /**
     * ფუნქცია, რომელიც აჩვენებს შეცდომის შეტყობინებას
     * @param {string} message - შეცდომის ტექსტი
     */
    function showError(message) {
        errorMessageElement.textContent = `შეცდომა: ${message}`;
        errorNotification.classList.remove('hidden');
        setTimeout(() => {
            errorNotification.classList.add('hidden');
        }, 5000); // 5 წამში ავტომატურად დაიმალება
    }

    /**
     * ფუნქცია, რომელიც აგენერირებს Structured Data-ს (JSON-LD)
     */
    function generateStructuredData(chapterNumber, pageCount) {
        const oldSchema = document.querySelector('script[type="application/ld+json"]');
        if (oldSchema) oldSchema.remove();

        const manhwaData = manhwas[currentManhwaId];
        const schema = {
            "@context": "https://schema.org",
            "@type": "ComicIssue",
            "issueNumber": chapterNumber,
            "numberOfPages": pageCount,
            "name": `${manhwaData.title} - თავი ${chapterNumber}`,
            "url": window.location.href,
            "isPartOf": {
                "@type": "ComicSeries",
                "name": manhwaData.title,
                "url": window.location.origin
            }
        };

        const script = document.createElement('script');
        script.type = 'application/ld+json';
        script.textContent = JSON.stringify(schema, null, 2);
        document.head.appendChild(script);
    }
    
    /**
     * Dark/Light Mode-ის ლოგიკა
     */
    function setupThemeToggle() {
        const themeToggleButton = document.getElementById('theme-toggle');
        const themeIcon = themeToggleButton.querySelector('i');

        const currentTheme = localStorage.getItem('theme');
        if (currentTheme === 'dark') {
            document.body.classList.add('dark-mode');
            themeIcon.classList.remove('fa-moon');
            themeIcon.classList.add('fa-sun');
        }

        themeToggleButton.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            let theme = 'light';
            if (document.body.classList.contains('dark-mode')) {
                theme = 'dark';
                themeIcon.classList.remove('fa-moon');
                themeIcon.classList.add('fa-sun');
            } else {
                themeIcon.classList.remove('fa-sun');
                themeIcon.classList.add('fa-moon');
            }
            localStorage.setItem('theme', theme);
        });
    }
    
    /**
     * Back to Top ღილაკის ლოგიკა
     */
    function setupBackToTopButton() {
        // ღილაკი გამოჩნდეს მხოლოდ თავის კითხვისას
        const imageContainer = document.getElementById('imagesContainer');
        imageContainer.addEventListener('scroll', () => {
            if (imageContainer.scrollTop > 300) {
                backToTopButton.classList.remove('hidden');
            } else {
                backToTopButton.classList.add('hidden');
            }
        });

        backToTopButton.addEventListener('click', () => {
            imageContainer.scrollTo({ top: 0, behavior: 'smooth' });
        });
    }

    // --- აპლიკაციის გაშვება ---
    document.addEventListener('DOMContentLoaded', () => {
      setupThemeToggle();
      setupBackToTopButton();

      // ანიმაციური პერსონაჟის კოდი
      const character = document.getElementById('animated-character');
      const walkSpeedBtn = document.getElementById('walkSpeedBtn');
      const runSpeedBtn = document.getElementById('runSpeedBtn');
      const toggleAnimationBtn = document.getElementById('toggleAnimationBtn');

      const animationFolderPath = 'images/';
      const idleFrames = 1, walkFrames = 2, runFrames = 2;
      const characterWidth = 110, characterHeight = 130;
      const walkSpeed = 0.5, runSpeed = 2;
      const idleInterval = 500, walkInterval = 450, runInterval = 300;
      let currentX = 0, direction = 1, animationFrame = 1;
      let currentSpeed = 0, currentInterval = idleInterval, currentAnimationType = 'idle';
      let animationIntervalId, movementIntervalId;
      let isAnimationRunning = false;
      character.style.width = `${characterWidth}px`; character.style.height = `${characterHeight}px`;

      function updateCharacterImage() {
        let maxFrames = (currentAnimationType === 'idle') ? idleFrames : (currentAnimationType === 'walk' ? walkFrames : runFrames);
        character.style.backgroundImage = `url('${animationFolderPath}animation_1_${currentAnimationType}_${animationFrame}.png')`;
        animationFrame = (animationFrame % maxFrames) + 1;
      }
      function moveCharacter() {
        if (!isAnimationRunning || currentAnimationType === 'idle') return;
        currentX += direction * currentSpeed;
        const maxX = window.innerWidth - characterWidth, minX = 0;
        if (currentX >= maxX) { currentX = maxX; direction = -1; }
        else if (currentX <= minX) { currentX = minX; direction = 1; }
        character.style.transform = `translateX(${currentX}px) scaleX(${direction})`;
      }
      function startAnimation(type, speed, interval) {
        if (animationIntervalId) clearInterval(animationIntervalId);
        if (movementIntervalId) clearInterval(movementIntervalId);
        currentAnimationType = type; currentSpeed = speed; currentInterval = interval;
        animationFrame = 1; isAnimationRunning = true;
        updateCharacterImage();
        animationIntervalId = setInterval(updateCharacterImage, currentInterval);
        if (type !== 'idle') movementIntervalId = setInterval(moveCharacter, 10);
        toggleAnimationBtn.textContent = 'გაჩერება';
        walkSpeedBtn.disabled = (type === 'walk'); runSpeedBtn.disabled = (type === 'run');
      }
      walkSpeedBtn.onclick = () => startAnimation('walk', walkSpeed, walkInterval);
      runSpeedBtn.onclick = () => startAnimation('run', runSpeed, runInterval);
      toggleAnimationBtn.onclick = () => {
         if (isAnimationRunning) {
           clearInterval(animationIntervalId); clearInterval(movementIntervalId);
           isAnimationRunning = false; toggleAnimationBtn.textContent = 'გაგრძელება';
         } else startAnimation(currentAnimationType, currentSpeed, currentInterval);
       };
      startAnimation('walk', walkSpeed, walkInterval);
    });
  </script>
</body>
