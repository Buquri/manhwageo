  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* სტილების გადატვირთვა კონსისტენტურობისთვის */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Dark/Light Mode-ის ცვლადები */
    :root {
      --bg-color: #E9967A;
      --text-color: #fff;
      --box-bg: #197;
      --modal-overlay-bg: rgba(0, 0, 0, 0.85);
      --modal-controls-bg: rgba(0, 0, 0, 1);
      --button-primary-bg: #ff4444;
      --button-primary-hover: #cc0000;
      --border-color: #333;
      --progress-bar-color: #ff4444;
    }

    body.dark-mode {
      --bg-color: #121212;
      --text-color: #e0e0e0;
      --box-bg: #1e1e1e;
      --modal-overlay-bg: rgba(10, 10, 10, 0.95);
      --modal-controls-bg: #1f1f1f;
      --button-primary-bg: #bb86fc;
      --button-primary-hover: #a053fc;
      --border-color: #444;
      --progress-bar-color: #bb86fc;
    }

    body {
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 0;
      padding: 10px;
      background-color: var(--bg-color);
      color: var(--text-color);
      overflow-x: hidden;
      min-height: 100vh;
      position: relative;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* მთავარი გრიდი (განლაგება) */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      flex-grow: 1;
    }

    @media (min-width: 768px) {
      .main-grid {
        grid-template-columns: repeat(2, 1fr);
        max-width: 750px;
        margin: 0 auto;
      }
    }

    /* ყუთების (ბოქსების) სტილები */
    .box {
      border: 2px solid var(--border-color);
      overflow: hidden;
      position: relative;
      background-color: var(--box-bg);
      background-size: cover;
      background-position: left;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-start;
      border-radius: 6px;
      width: 100%;
      aspect-ratio: 730 / 1050;
      box-sizing: border-box;
      padding: 5px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .box:hover {
      transform: translateY(-3px);
      box-shadow: 4px 4px 10px rgba(0,0,0,0.2);
    }

    .box.first { background-image: url('images/bg-main.jpg'); }
    .box.second { background-image: url('images/bg-2.jpg'); }
    .box.third { background-image: url('images/bg-3.jpg'); }
    .box.fourth { background-image: url('images/bg-4.jpg'); }
    .box.fifth { background-image: url('images/bg-5.jpg'); }
    .box.sixth { background-image: url('images/bg-6.jpg'); }

    .box h2,
    .box button {
      position: relative;
      z-index: 2;
      color: white;
      background-color: rgba(0, 0, 0, 0.7);
      padding: 8px 12px;
      border: none;
      border-radius: 10px;
      margin: 5px 10px 10px 15px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      font-size: 0.8em;
    }

    @media (min-width: 768px) {
      .box h2, .box button {
        font-size: 1em;
      }
    }

    .box button:hover:not(:disabled) {
      background-color: rgba(0, 0, 0, 0.9);
    }

    .box button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
      background-color: rgba(50, 50, 50, 0.7);
    }

    .views-counter {
      position: relative;
      z-index: 2;
      color: #ccc;
      background-color: rgba(0, 0, 0, 0.7);
      padding: 5px 10px;
      border-radius: 8px;
      margin: 0px 10px 5px 10px;
      font-size: 0.8em;
      display: flex;
      align-items: center;
      gap: 5px;
      align-self: flex-start;
    }

    .views-counter i {
      color: var(--button-primary-bg);
    }

    /* მოდალური ფანჯრების სტილები */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.95);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .overlay {
      background-color: var(--modal-overlay-bg);
      padding: 15px;
      border-radius: 8px;
      max-width: 95vw;
      max-height: 98vh;
      display: flex;
      flex-direction: column;
    }

    #chapterModal .overlay {
      padding: 0;
      max-width: 100vw;
      max-height: 100vh;
      width: 100%;
      height: 100%;
      border-radius: 0;
      background-color: #000;
    }
    
    .modal-scrollable-content {
        flex-grow: 1;
        overflow-y: auto;
        padding: 0 15px;
        -ms-overflow-style: none;
        scrollbar-width: none;
    }

    .modal-scrollable-content::-webkit-scrollbar {
        display: none;
    }

    /* თავების ღილაკების სტილები */
    .chapter-buttons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 10px;
      margin-top: 15px;
    }

    .chapter-buttons button {
      padding: 10px 15px;
      background-color: var(--button-primary-bg);
      border: none;
      color: white;
      font-size: 0.9em;
      cursor: pointer;
      border-radius: 5px;
      transition: background-color 0.5s ease, transform 0.8s ease;
    }

    @media (min-width: 768px) {
      .chapter-buttons {
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      }
      .chapter-buttons button {
        font-size: 1em;
      }
    }

    .chapter-buttons button:hover {
      background-color: var(--button-primary-hover);
      transform: scale(1.03);
    }

    /* სურათების/ვიდეოების კონტეინერი */
    .images-container {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      overflow-y: scroll;
      -ms-overflow-style: none;
      scrollbar-width: none;
      margin-top: 0;
      background-color: black;
    }

    .images-container::-webkit-scrollbar {
        display: none;
    }

    .images-container img, .images-container video {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 0;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.5s ease forwards;
      max-width: 100%;
    }

    .loading-indicator {
        text-align: center;
        padding: 20px;
        font-size: 1.2em;
        color: #ddd;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* მოდალის სათაური */
    .modal-header {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        width: 100%;
        padding: 15px;
        background-color: var(--modal-controls-bg);
        position: sticky;
        top: 0;
        z-index: 1000;
        transition: opacity 0.3s ease-out, visibility 0.3s ease-out;
        opacity: 1;
        visibility: visible;
    }

    #chapterModal .modal-header {
      padding: 10px 15px;
    }

    .modal-header.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 1.2em;
    }

    .modal-description {
      font-size: 0.9em;
      color: #b3da06;
      margin-top: 10px;
      margin-bottom: 15px;
    }

    /* მოდალის კონტროლები */
    .modal-controls {
      display: flex;
      flex-direction: column; /* MODIFIED: to allow progress bar on top */
      width: 100%;
      background-color: var(--modal-controls-bg);
      z-index: 1000;
      transition: opacity 0.3s ease-out, visibility 0.3s ease-out;
      opacity: 1;
      visibility: visible;
      margin-top: auto;
      position: sticky;
      bottom: 0;
    }

    .modal-controls.hidden {
      opacity: 0;
      visibility: hidden;
    }
    
    .controls-buttons-wrapper {
        display: flex;
        justify-content: space-between;
        padding: 15px;
        width: 100%;
    }

    .controls-buttons-wrapper .close-btn,
    .controls-buttons-wrapper .navigation-buttons button {
      margin: 0;
      padding: 8px 15px;
      font-size: 0.9em;
      flex: 1;
    }

    .controls-buttons-wrapper .close-btn {
      margin-left: 10px;
    }
    
    .navigation-buttons {
      display: flex;
      gap: 10px;
      flex-grow: 1;
    }
    
    .navigation-buttons button {
      background-color: var(--button-primary-bg);
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 5px;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }
    
    #fullscreenBtn {
      flex-grow: 0; 
      margin-left: auto; 
      margin-right: 10px;
      background-color: #6a5acd;
    }
    
    .navigation-buttons button:hover:not(:disabled) {
        background-color: var(--button-primary-hover);
        transform: scale(1.03);
    }

    .navigation-buttons button:disabled {
        background-color: #555;
        cursor: not-allowed;
        opacity: 0.6;
    }

    /* ADDED: პროგრესის ზოლის და ახალი ღილაკების სტილები */
    .progress-container {
        width: 100%;
        height: 5px;
        background-color: rgba(255, 255, 255, 0.2);
    }

    #progressBar {
        height: 100%;
        width: 0%;
        background-color: var(--progress-bar-color);
        transition: width 0.1s linear;
    }
    
    .scroll-buttons {
        display: flex;
        gap: 10px;
    }

    .scroll-buttons button {
        background: none;
        border: 1px solid var(--border-color);
        color: var(--text-color);
        width: 40px;
        height: 40px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 1rem;
        flex-shrink: 0;
    }
    /* END OF ADDED STYLES */

    /* ანიმაციური პერსონაჟი */
    #animated-character {
      position: fixed;
      bottom: 10px;
      left: 0;
      width: 120px;
      height: 130px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      z-index: 99;
      image-rendering: pixelated;
    }

    #character-controls {
      position: fixed;
      bottom: 3px;
      right: 3px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    #character-controls button {
      background-color: #6a5acd;
      color: white;
      border: none;
      padding: 3px 5px;
      border-radius: 3px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      font-size: 0.7em;
    }

    #character-controls button:hover {
      background-color: #483d8b;
    }

    #character-controls button:disabled {
      background-color: #777;
      cursor: not-allowed;
      opacity: 0.7;
    }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-analytics.js";
    import { getFirestore, doc, getDoc, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBRcdavGb1Pi2eQlN6T_UbNue2bEa-8t-g",
      authDomain: "manhwageo.firebaseapp.com",
      projectId: "manhwageo",
      storageBucket: "manhwageo.firebasestorage.app",
      messagingSenderId: "822450839137",
      appId: "1:822450839137:web:7dcb516bf572ae08191420",
      measurementId: "G-3KMGGLE821"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    export const db = getFirestore(app);

    window.updateAndGetViews = async function(manhwaId) {
      const docRef = doc(db, "manhwa_views", manhwaId);
      try {
        const docSnap = await getDoc(docRef);
        let views = 0;
        if (docSnap.exists()) {
          views = docSnap.data().count + 1;
          await updateDoc(docRef, { count: views });
        } else {
          views = 1;
          await setDoc(docRef, { count: views });
        }
        return views;
      } catch (error) {
        console.error("ნახვების განახლების შეცდომა: ", error);
        return "შეცდომა";
      }
    };

    window.getInitialViews = async function(manhwaId) {
      const docRef = doc(db, "manhwa_views", manhwaId);
      try {
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) {
          return docSnap.data().count;
        } else {
          return 0;
        }
      } catch (error) {
        console.error("საწყისი ნახვების წამოღების შეცდომა: ", error);
        return "შეცდომა";
      }
    };

    document.addEventListener('DOMContentLoaded', async () => {
      const manhwaBoxes = document.querySelectorAll('.box[data-manhwa-id]');
      for (const box of manhwaBoxes) {
        const manhwaId = box.dataset.manhwaId;
        if (manhwaId) {
          const viewsElement = box.querySelector(`#views-${manhwaId}`);
          if (viewsElement) {
            const views = await window.getInitialViews(manhwaId);
            viewsElement.textContent = views;
          }
        }
      }
    });
  </script>
</head>

  <script>
    const manhwas = {
      "ch": {

    let currentManhwaId = null;
    let currentChapterId = null;
    let currentOpenModalId = null;

    let scrollTimeout;

    function toggleModal(id, doPushState = true) {
      const modal = document.getElementById(id);
      if (modal.style.display === 'flex') {
        modal.style.display = 'none';
        if (doPushState && currentOpenModalId === id) {
          history.back();
          currentOpenModalId = null;
        }
        if (id === 'chapterModal') {
          if (document.fullscreenElement) {
            document.exitFullscreen();
          }
          document.getElementById('chapterModalHeader').classList.remove('hidden');
          document.getElementById('chapterModalControls').classList.remove('hidden');
          clearTimeout(scrollTimeout);
          history.pushState("", document.title, window.location.pathname + window.location.search);
        }
      } else {
        modal.style.display = 'flex';
        currentOpenModalId = id;
        if (doPushState) {
          history.pushState({ modal: id }, '', `#${id}`);
        }
      }
    }

    function openChapterSelect(manhwaId) {
      currentManhwaId = manhwaId;
      const manhwaData = manhwas[manhwaId];

      document.getElementById('chapterSelectTitle').textContent = manhwaData.title;
      document.getElementById('manhwaDescription').textContent = manhwaData.description;

      const chapterButtons = document.getElementById('chapterButtons');
      chapterButtons.innerHTML = '';

      if (manhwaData.chapters.length === 0) {
        chapterButtons.innerHTML = '<p style="text-align:center; color:#aaa; font-size: 0.9em;">თავები ჯერ არ არის დამატებული.</p>';
      } else {
        manhwaData.chapters.forEach(chapter => {
          const btn = document.createElement('button');
          btn.textContent = `თავი ${chapter.id}`;
          if (manhwaData.type === 'video') {
            btn.onclick = () => openChapter(chapter);
          } else {
            btn.onclick = () => openChapter(chapter);
          }
          chapterButtons.appendChild(btn);
        });
      }

      const viewsElement = document.querySelector(`.box[data-manhwa-id="${manhwaId}"] .views-counter span`);
      if (viewsElement && window.updateAndGetViews) {
        window.updateAndGetViews(manhwaId).then(views => {
          viewsElement.textContent = views;
        }).catch(error => {
          console.error("ნახვების განახლების შეცდომა openChapterSelect-დან: ", error);
          viewsElement.textContent = "შეცდომა";
        });
      }
      toggleModal('chapterSelect');
    }

    function loadChapterContent(chapter) {
        currentChapterId = chapter.id;
        const imagesContainer = document.getElementById('imagesContainer');
        imagesContainer.innerHTML = '<p class="loading-indicator">იტვირთება...</p>';
        imagesContainer.scrollTop = 0; 

        const chapterTitleElement = document.getElementById('chapterTitle');
        const manhwaData = manhwas[currentManhwaId];

        document.title = `${manhwaData.title} - თავი ${chapter.id} | Manhwageo`;
        const metaDescription = `წაიკითხეთ ${manhwaData.title}-ის ${chapter.id} თავი ქართულად. ${manhwaData.description.substring(0, 100)}...`;
        document.getElementById('meta-description').setAttribute('content', metaDescription);
        
        generateStructuredData(manhwaData, chapter);

        chapterTitleElement.textContent = `${manhwaData.title} - თავი ${chapter.id}`;
        
        document.getElementById('chapterModalHeader').classList.remove('hidden');
        document.getElementById('chapterModalControls').classList.remove('hidden');
        clearTimeout(scrollTimeout);

        setTimeout(() => {
            imagesContainer.innerHTML = ''; 
            if (manhwaData.type === 'image') {
                const startPage = chapter.skipFirst ? 2 : 1;
                for (let i = startPage; i <= chapter.pages; i++) {
                    const img = document.createElement('img');
                    img.src = `${manhwaData.folder}${currentManhwaId}${chapter.id}_page${i}.jpg`;
                    img.alt = `${manhwaData.title} - თავი ${chapter.id}, გვერდი ${i}`;
                    img.loading = 'lazy';
                    img.onerror = function() {
                        this.src = 'images/placeholder.jpg';
                        this.alt = 'სურათი ვერ მოიძებნა';
                    };
                    imagesContainer.appendChild(img);
                }
            } else if (manhwaData.type === 'video') {
                const video = document.createElement('video');
                video.src = `${manhwaData.folder}${chapter.file}`;
                video.controls = true;
                video.preload = 'auto';
                video.style.maxWidth = '100%';
                video.style.height = 'auto';
                video.style.display = 'block';
                video.autoplay = true;
                video.onerror = function() {
                    const errorDiv = document.createElement('div');
                    errorDiv.textContent = 'ვიდეოს ჩატვირთვის შეცდომა.';
                    errorDiv.style.color = 'red';
                    imagesContainer.appendChild(errorDiv);
                };
                imagesContainer.appendChild(video);
            }
            updateNavigationButtons();
            updateProgressBar(); // ADDED: პროგრესის განულება ახალ თავზე
        }, 200);
    }

    function openChapter(chapter) {
        loadChapterContent(chapter);
        toggleModal('chapterSelect', false);
        toggleModal('chapterModal', true);
        window.location.hash = `${currentManhwaId}-${chapter.id}`;
    }

    function updateNavigationButtons() {
        const prevBtn = document.getElementById('prevChapterBtn');
        const nextBtn = document.getElementById('nextChapterBtn');
        const manhwaData = manhwas[currentManhwaId];
        const currentChapterIndex = manhwaData.chapters.findIndex(ch => ch.id === currentChapterId);
        prevBtn.disabled = currentChapterIndex <= 0;
        nextBtn.disabled = currentChapterIndex >= manhwaData.chapters.length - 1;
    }

    function navigateChapter(direction) {
        const manhwaData = manhwas[currentManhwaId];
        const currentChapterIndex = manhwaData.chapters.findIndex(ch => ch.id === currentChapterId);
        const newChapterIndex = currentChapterIndex + direction;
        
        if (newChapterIndex >= 0 && newChapterIndex < manhwaData.chapters.length) {
            const newChapter = manhwaData.chapters[newChapterIndex];
            loadChapterContent(newChapter);
            window.location.hash = `${currentManhwaId}-${newChapter.id}`;
        }
    }

        if(modal && modal.style.display === 'flex') {
            toggleModal(currentOpenModalId, false);
        }
      }
    };
    
    function setupModalScrollListeners() {
        const imagesContainer = document.getElementById('imagesContainer');
        imagesContainer.addEventListener('scroll', () => {
            // ADDED: პროგრესის ზოლის განახლება სქროლვისას
            updateProgressBar();

            const currentScrollTop = imagesContainer.scrollTop;
            const header = document.getElementById('chapterModalHeader');
            const controls = document.getElementById('chapterModalControls');
            clearTimeout(scrollTimeout);
            if (currentScrollTop > lastScrollTop && currentScrollTop > 50) {
                header.classList.add('hidden');
                controls.classList.add('hidden');
            } else if (lastScrollTop - currentScrollTop > 30) {
                header.classList.remove('hidden');
                controls.classList.remove('hidden');
            }
            lastScrollTop = currentScrollTop <= 0 ? 0 : currentScrollTop;
        });

        imagesContainer.addEventListener('click', function() {
          const header = document.getElementById('chapterModalHeader');
          const controls = document.getElementById('chapterModalControls');
          if (header.classList.contains('hidden')) {
              header.classList.remove('hidden');
              controls.classList.remove('hidden');
              clearTimeout(scrollTimeout);
              scrollTimeout = setTimeout(() => {
                  header.classList.add('hidden');
                  controls.classList.add('hidden');
              }, 3000);
          } else {
              header.classList.add('hidden');
              controls.classList.add('hidden');
          }
        });
    }
    
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const chapterModal = document.getElementById('chapterModal');

        if (!document.fullscreenElement) {
            chapterModal.requestFullscreen().catch(err => {

        }

        if (!document.fullscreenElement) {
            icon.classList.remove('fa-compress');

    /**
     * ADDED: კითხვის პროგრესის ზოლის განახლების ფუნქცია
     */
    function updateProgressBar() {
        const imagesContainer = document.getElementById('imagesContainer');
        const progressBar = document.getElementById('progressBar');
        const scrollableHeight = imagesContainer.scrollHeight - imagesContainer.clientHeight;
        
        if (scrollableHeight <= 0) {
            progressBar.style.width = '100%';
            return;
        }
        
        const progress = (imagesContainer.scrollTop / scrollableHeight) * 100;
        progressBar.style.width = `${progress}%`;
    }

    /**
     * ADDED: ზემოთ/ქვემოთ სქროლვის ღილაკების ლოგიკა
     */
    function setupScrollButtons() {
        const imagesContainer = document.getElementById('imagesContainer');
        const scrollTopBtn = document.getElementById('scrollTopBtn');
        const scrollBottomBtn = document.getElementById('scrollBottomBtn');

        scrollTopBtn.addEventListener('click', () => {
            imagesContainer.scrollTo({ top: 0, behavior: 'smooth' });
        });
        
        scrollBottomBtn.addEventListener('click', () => {
            imagesContainer.scrollTo({ top: imagesContainer.scrollHeight, behavior: 'smooth' });
        });
    }

    function generateStructuredData(manhwa, chapter) {
        const oldSchema = document.querySelector('script[type="application/ld+json"]');
        if (oldSchema) oldSchema.remove();

        const schema = {
            "@context": "https://schema.org",
            "@type": "ComicIssue",
            "issueNumber": chapter.id,
            "name": `${manhwa.title} - თავი ${chapter.id}`,
            "url": window.location.href,
            "isPartOf": {
                "@type": "ComicSeries",
                "name": manhwa.title,
                "url": window.location.origin
            }
        };

        const script = document.createElement('script');
        script.type = 'application/ld+json';
        script.textContent = JSON.stringify(schema, null, 2);
        document.head.appendChild(script);
    }
    
    function setupThemeToggle() {
        const themeToggleButton = document.getElementById('theme-toggle');
        const themeIcon = themeToggleButton.querySelector('i');

        function applyTheme(theme) {
            if (theme === 'dark-mode') {
                document.body.classList.add('dark-mode');
                themeIcon.classList.remove('fa-sun');
                themeIcon.classList.add('fa-moon');
            } else {
                document.body.classList.remove('dark-mode');
                themeIcon.classList.remove('fa-moon');
                themeIcon.classList.add('fa-sun');
            }
        }

        const savedTheme = localStorage.getItem('theme') || 'light-mode';
        applyTheme(savedTheme);

        themeToggleButton.addEventListener('click', () => {
            let newTheme = document.body.classList.contains('dark-mode') ? 'light-mode' : 'dark-mode';
            localStorage.setItem('theme', newTheme);
            applyTheme(newTheme);
        });
    }

    function handleUrlHash() {
        const hash = window.location.hash.substring(1);
        if (!hash) return;

        const parts = hash.split('-');
        if (parts.length < 2) return;

        const manhwaId = parts[0];
        const chapterId = parseInt(parts[1], 10);

        if (manhwas[manhwaId] && !isNaN(chapterId)) {
            const chapterData = manhwas[manhwaId].chapters.find(c => c.id === chapterId);
            if (chapterData) {
                currentManhwaId = manhwaId;
                openChapter(chapterData);
            }
        }
    }

    function setupAnimatedCharacter() {
      const character = document.getElementById('animated-character');
      const walkSpeedBtn = document.getElementById('walkSpeedBtn');
      const runSpeedBtn = document.getElementById('runSpeedBtn');
      const toggleAnimationBtn = document.getElementById('toggleAnimationBtn');
      const animationFolderPath = 'images/';
      const idleFrames = 1, walkFrames = 2, runFrames = 2;
      const characterWidth = 110, characterHeight = 130;
      const walkSpeed = 0.5, runSpeed = 2;
      const idleInterval = 500, walkInterval = 450, runInterval = 300;
      let currentX = 0, direction = 1, animationFrame = 1;
      let currentSpeed = 0, currentInterval = idleInterval, currentAnimationType = 'idle';
      let animationIntervalId, movementIntervalId;
      let isAnimationRunning = false;
      character.style.width = `${characterWidth}px`;
      character.style.height = `${characterHeight}px`;
      function updateCharacterImage() {
        let maxFrames = (currentAnimationType === 'idle') ? idleFrames : (currentAnimationType === 'walk' ? walkFrames : runFrames);
        character.style.backgroundImage = `url('${animationFolderPath}animation_1_${currentAnimationType}_${animationFrame}.png')`;
        animationFrame = (animationFrame % maxFrames) + 1;
      }
      function moveCharacter() {
        if (!isAnimationRunning || currentAnimationType === 'idle') return;
        currentX += direction * currentSpeed;
        const maxX = window.innerWidth - characterWidth, minX = 0;
        if (currentX >= maxX) { currentX = maxX; direction = -1; }
        else if (currentX <= minX) { currentX = minX; direction = 1; }
        character.style.transform = `translateX(${currentX}px) scaleX(${direction})`;
      }
      function startAnimation(type, speed, interval) {
        if (animationIntervalId) clearInterval(animationIntervalId);
        if (movementIntervalId) clearInterval(movementIntervalId);
        currentAnimationType = type; currentSpeed = speed; currentInterval = interval;
        animationFrame = 1; isAnimationRunning = true;
        updateCharacterImage();
        animationIntervalId = setInterval(updateCharacterImage, currentInterval);
        if (type !== 'idle') { movementIntervalId = setInterval(moveCharacter, 10); }
        toggleAnimationBtn.textContent = 'გაჩერება';
        walkSpeedBtn.disabled = (type === 'walk');
        runSpeedBtn.disabled = (type === 'run');
      }
      walkSpeedBtn.onclick = () => startAnimation('walk', walkSpeed, walkInterval);
      runSpeedBtn.onclick = () => startAnimation('run', runSpeed, runInterval);
      toggleAnimationBtn.onclick = () => {
         if (isAnimationRunning) {
           clearInterval(animationIntervalId);
           clearInterval(movementIntervalId);
           isAnimationRunning = false;
           toggleAnimationBtn.textContent = 'გაგრძელება';
         } else {
           startAnimation(currentAnimationType, currentSpeed, currentInterval);
         }
       };
      startAnimation('walk', walkSpeed, walkInterval);
    }


    // --- აპლიკაციის გაშვება ---
    document.addEventListener('DOMContentLoaded', () => {
      setupThemeToggle();
      setupModalScrollListeners();
      setupAnimatedCharacter();
      setupScrollButtons(); // ADDED: ახალი ღილაკების ინიციალიზაცია
      handleUrlHash();
    });
  </script>
</body>
</html>
